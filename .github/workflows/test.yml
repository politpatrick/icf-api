name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  data:
    # Prüft, dass data/ zu den ClaML-Quellen in source/ passt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/build_data.sh /tmp/data
      - run: |
          for f in icf_flat.json qualifiers.json icd10gm.json; do
            cmp "data/$f" "/tmp/data/$f"
          done
