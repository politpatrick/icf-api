name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  data:
    # Prüft, dass icf_json/ zur ClaML-Quelle passt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/run_icf_workflow.sh "" /tmp/icf_json
      - run: |
          for f in icf_flat.json qualifiers.json; do
            diff -q "icf_json/$f" "/tmp/icf_json/$f"
          done
